<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventário da Casa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#2a2f36;--mut:#6b7280;--bd:#e5e2dc;--ac:#44546a;--acx:#fff;--ok:#1d7a46;--okb:#e3f4ea;--pe:#9a6200;--peb:#fff3d6;--no:#6b7280;--nob:#eceae6;--red:#b42318;--redb:#fde8e6;--sh:0 1px 3px rgba(0,0,0,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--card:#22252a;--tx:#ecebe8;--mut:#a0a5ad;--bd:#33373d;--ac:#9fb4d0;--acx:#14181d;--ok:#6fd49b;--okb:#17301f;--pe:#f0c26a;--peb:#33280f;--no:#a0a5ad;--nob:#2e3136;--red:#ff8b80;--redb:#3a1b18;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191c;--card:#22252a;--tx:#ecebe8;--mut:#a0a5ad;--bd:#33373d;--ac:#9fb4d0;--acx:#14181d;--ok:#6fd49b;--okb:#17301f;--pe:#f0c26a;--peb:#33280f;--no:#a0a5ad;--nob:#2e3136;--red:#ff8b80;--redb:#3a1b18;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:960px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:1.5rem;margin:4px 0 2px}h2{font-size:1.15rem;margin:22px 0 10px}
.sub{color:var(--mut);font-size:.9rem;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.kpi b{display:block;font-size:1.6rem}
button.kpi{text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%;transition:transform .15s}button.kpi:hover{transform:translateY(-2px)}.kpi span{color:var(--mut);font-size:.85rem}
.bar{height:12px;background:var(--nob);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.cat{display:flex;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;color:inherit;font:inherit;transition:transform .15s}
.cat:hover{transform:translateY(-2px)}.cat .ic{font-size:1.8rem}.cat .nm{font-weight:600}.cat small{color:var(--mut);display:block}
.cat.ok{border-left:5px solid var(--ok)}.cat.pend{border-left:5px solid var(--pe)}.cat.none{border-left:5px solid var(--bd)}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.pend{background:var(--peb);color:var(--pe)}.chip.none{background:var(--nob);color:var(--no)}
button{font:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn.del{background:var(--redb);color:var(--red);border-color:transparent}
.btn.full{width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1}
.back{background:none;border:0;color:var(--ac);font-weight:600;padding:8px 0;min-height:44px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
.item{padding:12px 14px}.item+.item{margin-top:8px}
.ih{display:flex;align-items:center;gap:10px}.ih .t{flex:1;min-width:0;background:none;border:0;text-align:left;color:inherit;font-weight:600;padding:6px 0}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.3rem}
.step input{width:56px;text-align:center;padding:0}
.xdel{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--redb);color:var(--red);font-size:1.1rem}
.units{margin-top:10px;display:grid;gap:6px}
.u{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:inherit;text-align:left}
.u small{color:var(--mut);display:block}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:f .2s}
.sh{background:var(--card);color:var(--tx);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:s .25s}
@media(min-width:720px){.ov{align-items:center}.sh{border-radius:20px}}
@keyframes f{from{opacity:0}}@keyframes s{from{transform:translateY(40px);opacity:0}}
.sh h3{margin:0 0 4px}.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:6px 0}.chk input{width:22px;min-height:22px}
.icons{display:flex;flex-wrap:wrap;gap:6px}.icons label{margin:0}.icons input{display:none}
.icons span{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;border:2px solid var(--bd);font-size:1.4rem;cursor:pointer}
.icons input:checked+span{border-color:var(--ac);background:var(--nob)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="sheet"></div><div id="toast" role="status"></div>
<script>
const CAT0=[
["Eletrodomésticos","🔌","Fogão|Geladeira|Impressora|Aspirador|Máquina de lavar|Micro-ondas|Air fryer|Outros"],
["Móveis","🛋️","Sofá|Estante|Cama|Colchão|Armário|Mesa|Outros"],
["Cama, mesa e banho","🛏️","Lençóis|Cobertores|Colchas|Toalhas de banho|Toalhas de mesa|Cortinas|Outros"],
["Louças","🍽️","Pratos|Copos|Taças|Xícaras|Pires|Talheres|Travessas|Outros"],
["Utensílios de cozinha","🍳","Panelas|Formas|Facas|Tábuas|Utensílios (espátulas, conchas, etc)|Panos de prato|Outros"],
["Vestimentas","👕","Vestidos|Calças|Bermudas/Shorts|Saias|Camisas|Casacos|Sapatos|Outros"],
["Acessórios","👜","Bolsas|Cintos|Colares|Pulseiras|Anéis|Brincos|Cachecóis|Chapéus|Outros"],
["Papéis","📄","Livros|Fotos|Cartas|Outros"]];
const LOCS=["Sala","Quarto 1","Quarto 2","Quarto 3","Cozinha","Banheiro","Área de serviço","Varanda","Quintal","Garagem","Depósito","Armário","Outro"];
const ESTS=["Novo","Ótimo","Bom","Regular","Ruim","Defeituoso"];
const ICONS=["📦","🧸","🎨","🎵","🧺","🪴","🕯️","⚽","🧰","🎁"];
let n=0;const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const S={cats:[],items:[],units:[],dests:["Carolina","Jorge Junior","Mirian","Sandra","Tatiana","Jorge Dantas","Doação","Venda","Descarte","Outro","A definir"],view:"home",cat:null,q:"",f:{cat:"",dest:"",loc:"",st:"",est:""},open:{}};
CAT0.forEach(([nome,icon,its])=>{const c={id:uid(),nome,icon,desc:"",user:false,ord:++n};S.cats.push(c);its.split("|").filter(Boolean).forEach(x=>S.items.push({id:uid(),cat:c.id,nome:x,desc:"",pre:true,cnt:0,ord:++n}))});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=u=>u.dest&&u.dest!=="A definir",uOf=id=>S.units.filter(u=>u.item===id),cat=id=>S.cats.find(c=>c.id===id),item=id=>S.items.find(i=>i.id===id);
const uname=u=>u.nome||u.padrao,dn=u=>u.dest==="Outro"&&u.destNome?"Outro: "+u.destNome:(u.dest||"A definir"),uloc=u=>u.loc?(u.locEsp?u.loc+" → "+u.locEsp:u.loc):"Sem local";
const stat=a=>!a.length?"none":a.every(ok)?"ok":"pend";
const chip=s=>`<span class="chip ${s}">${{ok:"✓ Destinado",pend:"● Pendente",none:"○ Não inventariado"}[s]}</span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
function sheet(h){$("#sheet").innerHTML=h?`<div class="ov" data-act="ovclose"><div class="sh" role="dialog" aria-modal="true">${h}</div></div>`:""}
const opts=(a,sel,ph)=>(ph!==undefined?`<option value="">${ph}</option>`:"")+a.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");

function home(){
 const t=S.units.length,d=S.units.filter(ok).length,p=t?Math.round(d/t*100):0;
 return `<h1>Inventário da Casa</h1><p class="sub">Registre os objetos e escolha quem fica com cada um.</p>
 <div class="kpis"><button class="card kpi" data-act="kpi" data-st=""><b>${t}</b><span>Itens inventariados</span></button><button class="card kpi" data-act="kpi" data-st="ok"><b style="color:var(--ok)">${d}</b><span>Com destino definido</span></button><button class="card kpi" data-act="kpi" data-st="pend"><b style="color:var(--pe)">${t-d}</b><span>Pendentes</span></button></div>
 
 <div class="row"><button class="btn" data-act="dests">Quem fica com o quê</button></div>
 <h2>Categorias</h2><div class="grid">${S.cats.map(c=>{const us=S.units.filter(u=>u.cat===c.id),s=stat(us),dn=us.filter(ok).length;
 return `<button class="card cat ${s}" data-act="cat" data-id="${c.id}"><span style="flex:1"><span class="nm">${esc(c.nome)}</span><small>${us.length?`${us.length} un. · ${dn} destinadas · ${Math.round(dn/us.length*100)}%`:"Nada registrado ainda"}</small></span>${chip(s)}</button>`}).join("")}</div>
 <div class="row"><button class="btn pri full" data-act="newcat">+ Nova categoria</button></div>`}

function catView(){
 const c=cat(S.cat),its=S.items.filter(i=>i.cat===c.id&&(!S.cq||i.nome.toLowerCase().includes(S.cq.trim().toLowerCase())));
 return `<button class="back" data-act="home">‹ Voltar</button><h1>${esc(c.nome)}</h1>
 <p class="sub">Informe quantos de cada item existem. Toque no nome para ver cada unidade.</p>
 <div class="row"><button class="btn pri" data-act="newitem">+ Adicionar item</button><button class="btn del" data-act="cdel">Excluir categoria</button></div>
 <input id="cq" type="search" placeholder="Buscar item nesta categoria…" value="${esc(S.cq||"")}" aria-label="Buscar item nesta categoria" style="margin:4px 0 12px"><div id="clist">${its.length?its.map(i=>{const us=uOf(i.id),o=S.open[i.id]&&us.length;return `<div class="card item"><div class="ih"><button class="t" data-act="tog" data-id="${i.id}">${esc(i.nome)} ${us.length?(o?"▴":"▾"):""}<br>${chip(stat(us))}</button>
 <div class="step"><button data-act="dec" data-id="${i.id}" aria-label="Diminuir ${esc(i.nome)}">−</button><input type="number" inputmode="numeric" min="0" max="2000" value="${us.length}" data-chg="qty" data-id="${i.id}" aria-label="Quantidade de ${esc(i.nome)}"><button data-act="inc" data-id="${i.id}" aria-label="Aumentar ${esc(i.nome)}">+</button></div><button class="xdel" data-act="idel" data-id="${i.id}" aria-label="Excluir ${esc(i.nome)}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div>
 ${us.length>1?`<button class="btn" style="width:100%;margin-top:10px" data-act="batch" data-id="${i.id}">Destinar várias de uma vez</button>`:""}${o?`<div class="units">${us.length>30?`<p class="sub">Mostrando 30 de ${us.length}. Use “Destinar várias de uma vez” para as demais.</p>`:""}${us.slice(0,30).map(u=>`<button class="u" data-act="unit" data-id="${u.id}"><span>${esc(uname(u))}<small>${esc(dn(u))}</small></span>${chip(ok(u)?"ok":"pend")}</button>`).join("")}</div>`:""}</div>`}).join(""):`<div class="empty">${S.cq?"Nenhum item encontrado.":"Você ainda não registrou nenhum item nesta categoria.<br>Toque em “+ Adicionar item” para começar."}</div>`}</div>`}

function unitRows(us){return us.length?(us.length>50?`<p class="sub">Mostrando 50 de ${us.length}.</p>`:"")+us.slice(0,50).map(u=>`<button class="u" data-act="unit" data-id="${u.id}"><span>${esc(uname(u))}<small>${esc(cat(u.cat).nome)} · ${esc(dn(u))}</small></span>${chip(ok(u)?"ok":"pend")}</button>`).join(""):`<div class="empty">Nenhum item encontrado.</div>`}
function filtered(){const q=S.q.trim().toLowerCase(),f=S.f;
 return S.units.filter(u=>{const h=[uname(u),u.padrao,cat(u.cat).nome,u.dest||"A definir",u.destNome||""].join(" ").toLowerCase();
 return (!q||h.includes(q))&&(!f.cat||u.cat===f.cat)&&(!f.dest||(u.dest||"A definir")===f.dest)&&(!f.st||(f.st==="ok")===!!ok(u))})}
function searchView(){const f=S.f;
 return `<button class="back" data-act="home">‹ Voltar</button><h1>${{ok:"Com destino definido",pend:"Pendentes","":"Itens inventariados"}[f.st]}</h1>${DL?`<div class="row"><button class="btn" data-act="pdflist">Compartilhar lista em PDF</button></div>`:""}
 <input id="q" type="search" placeholder="Nome, categoria ou pessoa…" value="${esc(S.q)}" aria-label="Buscar">
 <div class="filters"><select data-chg="f" data-k="cat" aria-label="Categoria"><option value="">Todas as categorias</option>${S.cats.map(c=>`<option value="${c.id}" ${f.cat===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select>
 ${f.st==="pend"?"":`<select data-chg="f" data-k="dest" aria-label="Destinatário">${opts(S.dests,f.dest,"Todos os destinos")}</select>`}
 
 
 </div>
 <div id="res" class="units"></div>`}
function destsView(){
 return `<button class="back" data-act="home">‹ Voltar</button><h1>Quem fica com o quê</h1><p class="sub">Calculado automaticamente a partir de cada objeto.</p>${DL?`<div class="row"><button class="btn" data-act="pdfdests">Compartilhar como PDF</button></div>`:""}
 ${S.dests.map(d=>{const us=S.units.filter(u=>(u.dest||"A definir")===d),g={};us.forEach(u=>{const nm=item(u.item).nome;g[nm]=(g[nm]||0)+1});
 const o=S.open["d"+d];return `<div class="card item"><button class="ih t" style="width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left" data-act="tog" data-id="d${esc(d)}"><b style="flex:1">${esc(d)} <span class="chip ${us.length?(d==="A definir"?"pend":"ok"):"none"}">${us.length} un.</span></b>${o?"▴":"▾"}</button>
 ${us.length?`<p class="sub">${Object.entries(g).map(([k,v])=>v+" × "+esc(k)).join(" · ")}</p>`:`<p class="sub">Nenhum item ainda.</p>`}
 ${o&&us.length?`<div class="units">${unitRows(us)}</div>`:""}</div>`}).join("")}
 <div class="row"><button class="btn pri full" data-act="newdest">+ Novo destinatário</button></div>`}

function render(){if(LOADING){$("#app").innerHTML='<div class="empty">Carregando o inventário…</div>';return}$("#app").innerHTML=({home,cat:catView,search:searchView,dests:destsView})[S.view]();if(S.view==="search")res();sync()}
function res(){const r=$("#res");if(r)r.innerHTML=unitRows(filtered())}
const go=(v,c)=>{S.view=v;if(c){S.cat=c;S.cq=""}render();scrollTo(0,0)};
let DL=null,LOADING=!!window.claude,DB=null,LAST={},timer=null,busy=false,stale=false,loaded=false,RO=false,SNAP={};
(async()=>{try{DL=window.claude?await claude.use("downloads"):null}catch(e){}if(DL)render()})();
function pdf(title,secs,file){
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J||!DL)return toast("Não foi possível gerar o PDF aqui");
 const d=new J({unit:"mm",format:"a4"}),W=210,M=16,H=297;let y=M;const need=h=>{if(y+h>H-M){d.addPage();y=M}};
 d.setFont("helvetica","bold");d.setFontSize(18);d.text(title,M,y);y+=7;
 d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(110);d.text("Inventário da Casa - "+new Date().toLocaleDateString("pt-BR"),M,y);y+=9;d.setTextColor(0);
 if(!secs.length){d.setFontSize(12);d.text("Nenhum item nesta lista.",M,y)}
 secs.forEach(s=>{need(14);d.setFont("helvetica","bold");d.setFontSize(13);d.text(s.h,M,y);y+=6;d.setFont("helvetica","normal");d.setFontSize(11);
  s.l.forEach(l=>d.splitTextToSize("- "+l,W-2*M-4).forEach(t=>{need(6);d.text(t,M+4,y);y+=5.5}));y+=4});
 DL.save({filename:file,data:d.output("blob")}).then(()=>toast("PDF pronto")).catch(e=>{if(!e||e.code!=="declined")toast("Não foi possível salvar o PDF")});
}
function pack(){const o={};S.cats.forEach(c=>o["cats/"+c.id]={nome:c.nome,desc:c.desc||"",user:!!c.user,ord:c.ord});
 S.items.forEach(i=>o["items/"+i.id]={cat:i.cat,nome:i.nome,desc:i.desc||"",pre:!!i.pre,cnt:i.cnt||0,ord:i.ord,units:S.units.filter(u=>u.item===i.id).map(u=>{const r={id:u.id,p:u.padrao};if(u.nome)r.n=u.nome;if(u.dest)r.d=u.dest;if(u.destNome)r.dn=u.destNome;if(u.obs)r.o=u.obs;return r})});
 o["meta/dests"]={list:S.dests};return o}
function sync(){if(!DB||!loaded||RO)return;clearTimeout(timer);timer=setTimeout(flush,500)}
async function flush(){timer=null;if(busy){timer=setTimeout(flush,300);return}busy=true;
 try{const p=pack();for(const k of Object.keys(p)){const j=JSON.stringify(p[k]);if(LAST[k]!==j){await DB.doc(k).set(p[k]);LAST[k]=j}}
  for(const k of Object.keys(LAST)){if(!(k in p)){await DB.doc(k).delete();delete LAST[k]}}
 }catch(e){RO=true;toast("Não foi possível salvar. Você pode estar sem permissão de edição, ou um item ficou grande demais.")}
 busy=false;if(stale&&!timer){stale=false;apply()}}
function apply(){const by=(a,b)=>(a.ord||0)-(b.ord||0),its=[...SNAP.i].sort(by);
 S.cats=[...SNAP.c].sort(by).map(x=>({id:x.id,nome:x.nome,desc:x.desc||"",icon:"",user:!!x.user,ord:x.ord}));
 S.items=its.map(x=>({id:x.id,cat:x.cat,nome:x.nome,desc:x.desc||"",pre:!!x.pre,cnt:x.cnt||0,ord:x.ord}));
 S.units=[];its.forEach(x=>(x.units||[]).forEach(u=>S.units.push({id:u.id,item:x.id,cat:x.cat,padrao:u.p,nome:u.n||"",loc:"",locEsp:"",dest:u.d||"",destNome:u.dn||"",est:"",obs:u.o||""})));
 if(SNAP.d&&SNAP.d.list)S.dests=SNAP.d.list;
 if(S.view==="cat"&&!cat(S.cat))S.view="home";
 LAST={};const p=pack();Object.keys(p).forEach(k=>LAST[k]=JSON.stringify(p[k]));render()}
function boot(){const er=()=>{},rd=s=>s.docs.map(d=>({id:d.id,...d.data()})),
 t=setTimeout(()=>{if(!loaded){LOADING=false;toast("Não foi possível carregar os dados salvos");render()}},10000),
 on=(k,v)=>{SNAP[k]=v;if(!loaded){if(SNAP.c&&SNAP.i&&SNAP.d!==undefined){loaded=true;clearTimeout(t);LOADING=false;if(!SNAP.d&&!SNAP.c.length&&!SNAP.i.length)render();else apply()}}else if(timer||busy)stale=true;else apply()};
 DB.collection("cats").onSnapshot(s=>on("c",rd(s)),er);DB.collection("items").onSnapshot(s=>on("i",rd(s)),er);DB.doc("meta/dests").onSnapshot(s=>on("d",s.exists?s.data():null),er)}
(async()=>{if(!window.claude)return;try{DB=await claude.use("db")}catch(e){}if(!DB){LOADING=false;render();return}boot()})();
const cnt=n=>n+" ite"+(n===1?"m":"ns");
const grp=(us,ex)=>{const g={},nm=[];us.forEach(u=>{const x=ex?ex(u):"";if(u.nome)nm.push(u.nome+" ("+cat(u.cat).nome+")"+x);else{const k=u.item+"|"+x;(g[k]=g[k]||{u,x,n:0}).n++}});return Object.values(g).map(e=>e.n+" x "+item(e.u.item).nome+" ("+cat(e.u.cat).nome+")"+e.x).concat(nm)};

function addUnits(i,k){for(let j=0;j<k;j++){i.cnt++;S.units.push({id:uid(),item:i.id,cat:i.cat,padrao:i.nome+" "+i.cnt,nome:"",loc:"",locEsp:"",dest:"",est:"",obs:""})}}
function setQty(id,v){const i=item(id),cur=uOf(id).length;v=Math.max(0,Math.min(2000,parseInt(v)||0));
 if(v>cur){addUnits(i,v-cur);S.open[id]=v<=10;render()}else if(v<cur)removeSheet(i,cur-v);else render()}
function removeSheet(i,k){const us=uOf(i.id),pre=[...us].reverse().sort((a,b)=>ok(a)-ok(b)).slice(0,k).map(u=>u.id);
 sheet(`<h3>Remover ${k} unidade${k>1?"s":""} de ${esc(i.nome)}?</h3><p class="sub">Escolha ${k} para remover. Esta ação não pode ser desfeita.</p>
 ${us.map(u=>`<label class="chk"><input type="checkbox" name="rm" value="${u.id}" ${pre.includes(u.id)?"checked":""}> ${esc(uname(u))} — ${ok(u)?"Destinado a "+esc(u.dest):"Pendente"}</label>`).join("")}
 <div class="row"><button class="btn" data-act="cancel">Cancelar</button><button class="btn del" data-act="rmgo" data-id="${i.id}" data-k="${k}">Remover</button></div>`)}
function unitSheet(id){const u=S.units.find(x=>x.id===id),i=item(u.item);
 sheet(`<h3>${esc(uname(u))}</h3><p class="sub">${esc(cat(u.cat).nome)} · item original: ${esc(i.nome)}</p>
 <label for="f_n">Nome (opcional)</label><input id="f_n" value="${esc(u.nome)}" placeholder="${esc(u.padrao)}">
 <label for="f_d">Quem fica com ele?</label><select id="f_d">${opts(S.dests,u.dest||"A definir")}</select>
 <div id="f_wrap" ${u.dest==="Outro"?"":"hidden"}><label for="f_dn">Nome da pessoa</label><input id="f_dn" value="${esc(u.destNome||"")}" placeholder="Ex.: Tia Marta"></div>
 <label for="f_o">Observações</label><textarea id="f_o" rows="3" placeholder="Ex.: precisa de reparo">${esc(u.obs)}</textarea>
 <div class="row"><button class="btn del" data-act="udel" data-id="${id}">Excluir</button><button class="btn" data-act="cancel">Cancelar</button><button class="btn pri" data-act="usave" data-id="${id}">Salvar</button></div>`)}
const form=(t,body,act,lbl="Salvar")=>sheet(`<h3>${t}</h3>${body}<div class="row"><button class="btn" data-act="cancel">Cancelar</button><button class="btn pri" data-act="${act}">${lbl}</button></div>`);
const v=id=>$("#"+id).value.trim();

const A={
 home:()=>go("home"),search:()=>go("search"),
 pdfdests:()=>pdf("Quem fica com o quê",S.dests.map(d=>({h:d,us:S.units.filter(u=>(u.dest||"A definir")===d)})).filter(s=>s.us.length).map(s=>({h:s.h+" ("+cnt(s.us.length)+")",l:grp(s.us,u=>s.h==="Outro"&&u.destNome?" - "+u.destNome:"")})),"quem-fica-com-o-que.pdf"),
 pdflist:()=>{const st=S.f.st,us=filtered();pdf({ok:"Itens com destino definido",pend:"Itens pendentes","":"Itens inventariados"}[st],S.cats.map(c=>({c,us:us.filter(u=>u.cat===c.id)})).filter(s=>s.us.length).map(s=>({h:s.c.nome+" ("+cnt(s.us.length)+")",l:grp(s.us,u=>ok(u)?" - "+dn(u):"")})),{ok:"destinados.pdf",pend:"pendentes.pdf","":"inventario.pdf"}[st])},
 kpi:d=>{S.q="";S.f={cat:"",dest:"",loc:"",st:d.st};go("search")},dests:()=>go("dests"),cat:d=>go("cat",d.id),cancel:()=>{sheet("");render()},
 ovclose:(d,t,e)=>{if(e.target===t)A.cancel()},
 tog:d=>{S.open[d.id]=!S.open[d.id];render()},inc:d=>setQty(d.id,uOf(d.id).length+1),dec:d=>uOf(d.id).length&&setQty(d.id,uOf(d.id).length-1),
 unit:d=>unitSheet(d.id),
 usave:d=>{const u=S.units.find(x=>x.id===d.id);if(!u){sheet("");return render()}if(v("f_d")==="Outro"&&!v("f_dn"))return toast("Digite o nome da pessoa");Object.assign(u,{nome:v("f_n"),dest:v("f_d")==="A definir"?"":v("f_d"),destNome:v("f_d")==="Outro"?v("f_dn"):"",obs:v("f_o")});sheet("");render();toast("Salvo!")},
 udel:d=>sheet(`<h3>Excluir este objeto?</h3><p class="sub">Esta ação não pode ser desfeita.</p><div class="row"><button class="btn" data-act="cancel">Voltar</button><button class="btn del" data-act="udelgo" data-id="${d.id}">Sim, excluir</button></div>`),
 udelgo:d=>{S.units=S.units.filter(u=>u.id!==d.id);sheet("");render();toast("Objeto excluído")},
 cdel:()=>{const c=cat(S.cat),ni=S.items.filter(i=>i.cat===c.id).length,nu=S.units.filter(u=>u.cat===c.id).length;sheet(`<h3>Excluir a categoria “${esc(c.nome)}”?</h3><p class="sub">Isso remove ${ni} ite${ni===1?"m":"ns"} do catálogo${nu?` e ${nu} unidade${nu>1?"s":""} já cadastrada${nu>1?"s":""}, inclusive destinos já definidos`:""}. Esta ação não pode ser desfeita.</p><div class="row"><button class="btn" data-act="cancel">Voltar</button><button class="btn del" data-act="cdelgo">Sim, excluir</button></div>`)},
 cdelgo:()=>{const id=S.cat;S.units=S.units.filter(u=>u.cat!==id);S.items=S.items.filter(i=>i.cat!==id);S.cats=S.cats.filter(c=>c.id!==id);if(S.f.cat===id)S.f.cat="";S.cat=null;sheet("");go("home");toast("Categoria excluída")},
 batch:d=>{const i=item(d.id),p=uOf(d.id).filter(u=>!ok(u)).length;if(!p)return toast("Todas as unidades já têm destino");sheet(`<h3>Destinar várias de “${esc(i.nome)}”</h3><p class="sub">${p} unidade${p>1?"s":""} sem destino.</p><label for="b_q">Quantas unidades?</label><input id="b_q" type="number" inputmode="numeric" min="1" max="${p}" value="${p}"><label for="b_d">Para quem?</label><select id="b_d">${opts(S.dests.filter(x=>x!=="A definir"),"")}</select><div id="b_wrap" hidden><label for="b_n">Nome da pessoa</label><input id="b_n" placeholder="Ex.: Tia Marta"></div><div class="row"><button class="btn" data-act="cancel">Cancelar</button><button class="btn pri" data-act="bgo" data-id="${d.id}">Destinar</button></div>`)},
 bgo:d=>{const dest=v("b_d"),nm=v("b_n"),pe=uOf(d.id).filter(u=>!ok(u)),k=Math.max(1,Math.min(pe.length,parseInt(v("b_q"))||0));if(dest==="Outro"&&!nm)return toast("Digite o nome da pessoa");pe.slice(0,k).forEach(u=>{u.dest=dest;u.destNome=dest==="Outro"?nm:""});sheet("");render();toast(k+" unidade"+(k>1?"s":"")+" destinada"+(k>1?"s":"")+" a "+(dest==="Outro"?nm:dest))},
 idel:d=>{const i=item(d.id),k=uOf(d.id).length;sheet(`<h3>Excluir “${esc(i.nome)}”?</h3><p class="sub">${k?`Isso também remove ${k===1?"a unidade cadastrada":"as "+k+" unidades cadastradas"}, inclusive destinos já definidos. `:""}Esta ação não pode ser desfeita.</p><div class="row"><button class="btn" data-act="cancel">Voltar</button><button class="btn del" data-act="idelgo" data-id="${d.id}">Sim, excluir</button></div>`)},
 idelgo:d=>{S.items=S.items.filter(i=>i.id!==d.id);S.units=S.units.filter(u=>u.item!==d.id);sheet("");render();toast("Item excluído")},
 rmgo:d=>{const ids=[...document.querySelectorAll("[name=rm]:checked")].map(x=>x.value);if(ids.length!==+d.k)return toast("Escolha exatamente "+d.k);S.units=S.units.filter(u=>!ids.includes(u.id));sheet("");render();toast("Removido")},
 newitem:()=>form("Adicionar item",`<label for="n_n">Nome do item</label><input id="n_n"><label for="n_q">Quantidade inicial</label><input id="n_q" type="number" inputmode="numeric" min="0" value="0"><label for="n_d">Descrição (opcional)</label><input id="n_d">`,"saveitem","Adicionar"),
 saveitem:()=>{const nm=v("n_n");if(!nm)return toast("Digite o nome do item");const i={id:uid(),cat:S.cat,nome:nm,desc:v("n_d"),pre:false,cnt:0,ord:Date.now()+Math.random()};S.items.push(i);addUnits(i,Math.min(2000,Math.max(0,parseInt(v("n_q"))||0)));S.open[i.id]=uOf(i.id).length<=10;sheet("");render();toast("Item adicionado")},
 newcat:()=>form("Nova categoria",`<label for="c_n">Nome</label><input id="c_n"><label for="c_d">Descrição (opcional)</label><input id="c_d"><label for="c_i">Itens iniciais (separe por vírgula, opcional)</label><textarea id="c_i" rows="2"></textarea>`,"savecat","Criar"),
 savecat:()=>{const nm=v("c_n");if(!nm)return toast("Digite o nome da categoria");const c={id:uid(),nome:nm,desc:v("c_d"),icon:"",user:true,ord:Date.now()};S.cats.push(c);v("c_i").split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>S.items.push({id:uid(),cat:c.id,nome:x,desc:"",pre:false,cnt:0,ord:Date.now()+Math.random()}));sheet("");render();toast("Categoria criada")},
 newdest:()=>form("Novo destinatário",`<label for="d_n">Nome</label><input id="d_n">`,"savedest","Adicionar"),
 savedest:()=>{const nm=v("d_n");if(!nm)return toast("Digite um nome");if(S.dests.includes(nm))return toast("Esse nome já existe");S.dests.splice(S.dests.length-1,0,nm);sheet("");render();toast("Destinatário adicionado")}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(t&&A[t.dataset.act])A[t.dataset.act](t.dataset,t,e)});
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.chg;if(t.id==="f_d")$("#f_wrap").hidden=t.value!=="Outro";if(t.id==="b_d")$("#b_wrap").hidden=t.value!=="Outro";if(k==="qty")setQty(t.dataset.id,t.value);if(k==="f"){S.f[t.dataset.k]=t.value;res()}});
document.addEventListener("input",e=>{if(e.target.id==="cq"){S.cq=e.target.value;const t=document.createElement("div");t.innerHTML=catView();$("#clist").innerHTML=t.querySelector("#clist").innerHTML}if(e.target.id==="q"){S.q=e.target.value;res()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").innerHTML)A.cancel()});
render();
</script>
</body>
</html>
